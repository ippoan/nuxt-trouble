name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: read
  pull-requests: write
  id-token: write
  # ci-workflows#170 で auto-merge.yml の job が checks: read を宣言した
  # (全 check green 検証ガード)。nested (frontend-ci 経由) でも leaf caller の
  # 許可が無いと startup_failure になる (Refs ippoan/ci-workflows#169)。
  checks: read

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      # integration test (rust-alc-api の image を立てて叩く) は持たない。
      # trouble の API は alc-trouble-worker へ移り、rust から口が消えたため
      # (Refs ippoan/rust-alc-api#747)。API の検証は trouble-worker 側の DB テストが担う。
      install_command: 'npm install'
      post_install_script: 'npx nuxt prepare && npx wrangler types'
      # PR 時に @ippoan/auth-client@dev を overlay install する。
      # createIdentityProxyHandler (= /api/proxy/* の本体) は dev dist-tag にしか
      # 無く、committed lockfile があると "dev" 指定でも npm が古い版を再利用する
      # ため (npm/cli#7562)、この overlay が無いと typecheck が
      # "@ippoan/auth-client/server が無い" で必ず fail する。Refs rust-alc-api#434
      use_auth_client_dev: true
      # #434 step 2: wrangler.toml に INTERNAL_SHARED_SECRET の
      # secrets_store_secrets binding を追加したので secret-verify が必須化する。
      # GCP cloudsql-sv の同名 secret を WIF で検証 (ippoan org vars)。
      gcp_secret_verify_project: ${{ vars.GCP_PROJECT_ID_STAGING }}
      gcp_secret_verify_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_secret_verify_sa: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
    # inherit で org-level secret も渡す: CI_APP_ID / CI_APP_PRIVATE_KEY
    # (auto-merge job) 等。frontend-ci の他 caller と同じ標準形。
    secrets: inherit
